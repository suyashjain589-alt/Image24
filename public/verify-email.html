<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>Verify Email — IMAGE 24</title><meta name="description" content="Verify your IMAGE 24 account email address."><link rel="icon" type="image/png" href="/assets/image24-logo.png"><link rel="stylesheet" href="/tools/tool.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{max-width:560px;width:100%;padding:32px;border:1px solid var(--line);border-radius:22px;background:#0d1321;text-align:center}.card h1{margin:8px 0 10px}.card p{color:#9aa6bf;line-height:1.7}.ok{color:#7eeaff}.err{color:#ff9c9c}.btn{display:inline-block;margin-top:16px;text-decoration:none}</style><link rel="stylesheet" href="/assets/a11y.css"></head><body><main class="card"><img src="/assets/image24-logo.png" alt="IMAGE 24" width="52" height="52"><h1>Email verification</h1><p id="status">Verifying your email address…</p><a class="primary btn" href="/">Go to IMAGE 24</a></main><script>const s=document.getElementById('status');const t=new URLSearchParams(location.search).get('token');if(!t){s.className='err';s.textContent='Verification link is missing or invalid.'}else{fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})}).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(x=>{s.className=x.ok?'ok':'err';s.textContent=x.j.message||x.j.error||'Could not verify this email.'}).catch(()=>{s.className='err';s.textContent='Could not verify this email. Please try again.'})}</script><script src="/assets/a11y.js"></script></body></html>
