<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>IMAGE 24 — Reset password</title><meta name="description" content="Reset your IMAGE 24 account password securely."><link rel="icon" type="image/png" href="/assets/image24-logo.png"><style>body{margin:0;background:#070a12;color:#eef2ff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 32px));padding:28px;border:1px solid #202a43;border-radius:20px;background:#0d1220;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px}.muted{color:#98a4bd;line-height:1.6}.field{display:block;margin:16px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:10px;border:1px solid #2a3550;background:#080d18;color:#fff;font-size:16px}button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#fff;color:#0b1020;font-weight:800;font-size:15px;cursor:pointer}.msg{margin-top:14px;min-height:24px;color:#aebbd3}a{color:#7eeaff}</style><link rel="stylesheet" href="/assets/a11y.css"></head><body><main class="card" aria-labelledby="title"><h1 id="title">Reset password</h1><p class="muted">Choose a new password for your IMAGE 24 account.</p><form id="form"><label class="field" for="password">New password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" minlength="8" maxlength="128" required><label class="field" for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" minlength="8" maxlength="128" required><button type="submit">Update password</button><div id="msg" class="msg" role="status" aria-live="polite"></div><p id="password-strength-hint" class="muted" aria-live="polite">Use 8–128 characters. A longer passphrase is recommended.</p></form><p class="muted"><a href="/">Back to IMAGE 24</a></p></main><script>const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('form'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8||p.length>128){msg.textContent='Password must be 8–128 characters.';return}if(p!==c){msg.textContent='Passwords do not match.';return}if(!token){msg.textContent='This reset link is missing or invalid.';return}const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})}),j=await r.json().catch(()=>({}));msg.textContent=j.message||j.error||'Could not reset password.';if(r.ok){form.reset();setTimeout(()=>location.href='/',1200)}});</script><script src="/assets/a11y.js"></script></body></html>
